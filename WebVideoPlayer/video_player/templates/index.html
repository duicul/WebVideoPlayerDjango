<!DOCTYPE html>
<html>

<head>
    <title>Web Video Player </title>
   <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png"/>
    
    
    {% load static %} 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{% static 'css/video-js.css' %}" rel="stylesheet" />
    <script src="{% static 'js/video.js'%}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
  <!--<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>-->
    <script src="{% static 'js/jquery-3.5.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app-ui.css' %}">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
</head>

<body class="login-page">
<nav class="navbar navbar-expand-lg app-navbar login-navbar">
 <a class="navbar-brand" href="{% url 'entry_point' %}">
    <span class="brand-mark" aria-hidden="true">▶</span>
    Web Video Player
 </a>
</nav>
   <main class="login-shell">
   <form class="login-card" name="form" action="{% url 'login' %}"
         method = "POST" >{% csrf_token %}
         <div class="login-heading">
            <p class="eyebrow">YOUR PERSONAL MEDIA LIBRARY</p>
            <h1>Welcome back</h1>
            <p>Sign in to pick up where you left off.</p>
         </div>
         <div class="form-group">
            <label for="login-username">Username</label>
            <input id="login-username" class="form-control" type="text"
               placeholder="Username" name="username" autocomplete="username" required />
         </div>
         <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" class="form-control" type="password"
               placeholder="Password" name="password" autocomplete="current-password" required/>
         </div>
         {% if login == "wrong" %}
         <p class="login-error" role="alert">Wrong password. Please try again.</p>
         {% endif %}
         <button class="btn btn-primary login-submit" type="submit" value="Login">
            Sign in
         </button>
      </form>
   </main>
</body>
</html>
